<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto Perfeição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4EF; --surface:#FFFFFF; --ink:#18202B; --muted:#5B6573; --line:#DADDD5;
  --accent:#2747C7; --accent-soft:#E4E9FB; --mark:#F7DC5A; --ok:#1F7A4D; --warn:#B45309;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F131A; --surface:#171C25; --ink:#E8EAEE; --muted:#9AA3B2; --line:#2A3140;
    --accent:#8AA2FF; --accent-soft:#1E2742; --mark:#8C7516; --ok:#4CC38A; --warn:#F0A04B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F131A; --surface:#171C25; --ink:#E8EAEE; --muted:#9AA3B2; --line:#2A3140;
  --accent:#8AA2FF; --accent-soft:#1E2742; --mark:#8C7516; --ok:#4CC38A; --warn:#F0A04B;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;background:var(--accent);border-radius:3px;display:inline-block;box-shadow:4px 4px 0 var(--mark)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
nav.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud b{background:var(--ok)} .sync.busy b{background:var(--warn)}
main{padding:28px 0 80px}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.lead{font-size:19px;max-width:65ch;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat .n{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:14px;color:var(--muted);margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.trow{display:grid;grid-template-columns:34px 1fr 54px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);text-decoration:none;color:inherit}
.trow:last-child{border-bottom:0}
.trow:hover .tname{color:var(--accent)}
.num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pct{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tname{font-weight:600;font-size:15px}
.chk{display:flex;gap:12px;align-items:flex-start}
.chk input{appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin:2px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.chk input:checked{background:var(--ok);border-color:var(--ok)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-title{background:linear-gradient(transparent 55%,var(--mark) 55%);}
.next li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line)}
.next{padding:0;margin:0}
.next li:last-child{border-bottom:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.g{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.pill.p{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.l{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:hover{opacity:.88}
.rules{margin:0;padding-left:22px}
.rules li{margin:6px 0}
pre.prompt{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--accent-soft);border-radius:8px;padding:14px;margin:10px 0;line-height:1.5}
.tracks{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.tracks{grid-template-columns:1fr}}
.tlist{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
@media (max-width:860px){.tlist{position:static;max-height:none}}
.tlist button{width:100%;text-align:left;background:transparent;border:0;border-left:4px solid transparent;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:30px 1fr 42px;gap:6px;align-items:center;border-radius:0 8px 8px 0}
.tlist button:hover{background:var(--accent-soft)}
.tlist button[aria-pressed="true"]{border-left-color:var(--accent);background:var(--accent-soft)}
.thead{border-left:6px solid var(--tc,var(--accent))}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.step.isdone{border-color:var(--ok)}
.stitle{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25}
.step .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.step .desc{margin-top:8px;max-width:72ch}
.res{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.res li{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:15px}
.rtype{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);min-width:76px}
.proj{margin-top:10px;font-size:15px;border-left:3px solid var(--mark);padding:4px 10px;background:color-mix(in srgb,var(--mark) 14%,transparent)}
.phase{border-left:4px solid var(--line);padding:4px 0 4px 20px;margin-left:6px;position:relative}
.phase::before{content:"";position:absolute;left:-11px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:4px solid var(--line)}
.phase.now{border-left-color:var(--accent)}
.phase.now::before{border-color:var(--accent);background:var(--mark)}
.phase.past::before{background:var(--ok);border-color:var(--ok)}
.pgroup{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.pgroup .card{padding:14px}
.pgroup .chk{padding:5px 0;font-size:15px}
.tlabel{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.tlabel i{width:10px;height:10px;border-radius:2px;background:var(--tc);display:inline-block}
.search{width:100%;max-width:520px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:16px}
.gloss dt{font-family:var(--display);font-weight:700;font-size:17px}
.gloss dd{margin:4px 0 0;color:var(--muted);font-size:15px}
.gcat{grid-column:1/-1;margin-top:12px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
th{font-family:var(--display);background:var(--accent-soft)}
.form{display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr auto;align-items:end}
@media (max-width:760px){.form{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600}
label.f input,label.f select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface)}
textarea{width:100%;min-height:110px;resize:vertical}
.goal{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.goal .x{margin-left:auto;background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.logitem{padding:10px 0;border-bottom:1px solid var(--line)}
.logitem time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sec{margin-top:28px}
.sec>h2{margin-bottom:12px}
</style>
</head>

const LS_KEY = "projeto-perfeicao-v1";
let state = {done:{}, goals:[], log:[], updated:0};
let dbRef = null, writing = false, dirty = false, saveTimer = null, cloud = false;
try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); if (s && typeof s === "object") state = normalize(s); } } catch(e) {}

function normalize(s){
  return {done: (s.done && typeof s.done === "object") ? {...s.done} : {},
          goals: Array.isArray(s.goals) ? s.goals.slice(0,300).map(g=>({...g})) : [],
          log: Array.isArray(s.log) ? s.log.slice(0,300).map(l=>({...l})) : [],
          updated: Number(s.updated)||0};
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {} }
function touch(){
  state.updated = Date.now(); saveLocal(); dirty = true;
  if (dbRef){ setSync("busy","Salvando…"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
}
async function flush(){
  if (!dbRef || writing || !dirty) return;
  writing = true; dirty = false;
  try { await dbRef.set(JSON.parse(JSON.stringify(state))); setSync("cloud","Salvo na sua conta"); }
  catch(e){
    if (e && e.code === "invalid_argument"){ dbRef = null; cloud = false; setSync("","Salvo só neste navegador"); }
    else { dirty = true; setSync("busy","Não salvou ainda, tentando de novo"); setTimeout(flush, 3000 + Math.random()*2000); }
  }
  writing = false;
  if (dirty && dbRef) flush();
}
function setSync(cls, txt){ const el = document.getElementById("sync"); el.className = "sync " + cls; el.lastElementChild.textContent = txt; }

async function connectDb(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  let db = null;
  try { db = await window.claude.use("db"); } catch(e) { db = null; }
  if (!db) return;
  let ref;
  try { ref = db.doc("progress/main"); } catch(e){ return; }
  setSync("busy","Conectando à sua conta…");
  const timer = setTimeout(()=>setSync("", "Sem conexão com a conta, salvo neste navegador"), 10000);
  let first = true;
  ref.onSnapshot(snap => {
    if (snap.metadata && snap.metadata.fromCache === false) clearTimeout(timer);
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    dbRef = ref; cloud = true;
    if (snap.exists){
      const remote = normalize(snap.data() || {});
      if (remote.updated > state.updated){ state = remote; saveLocal(); render(); }
      else if (first && state.updated > remote.updated){ dirty = true; flush(); }
    } else if (first && state.updated > 0){ dirty = true; flush(); }
    if (!writing && !dirty) setSync("cloud","Salvo na sua conta");
    first = false;
  }, err => { clearTimeout(timer); dbRef = null; cloud = false; setSync("", "Salvo só neste navegador"); });
}

}

function viewTracks(){
  const t = TRACKS.find(x=>x.id===selTrack) || TRACKS[0], ti = TRACKS.indexOf(t), p = trackPct(t);
  const steps = ALL.filter(s=>s.track===t && (selPhase<0 || s.f===selPhase));
  const phasesIn = [...new Set(t.steps.map(s=>s[1]))].sort();
  return `<div class="tracks">
    <aside class="card tlist" style="padding:8px">
      ${TRACKS.map((x,i)=>{const q=trackPct(x);return `<button data-track="${x.id}" aria-pressed="${x.id===t.id}"><span class="num">${String(i+1).padStart(2,"0")}</span><span class="tname">${esc(x.name)}</span><span class="pct">${q.p}%</span></button>`}).join("")}
    </aside>
    <section>
      <div class="card thead" style="--tc:${TC[t.g]}">
        <span class="num">Trilha ${String(ti+1).padStart(2,"0")} de ${TRACKS.length}</span>
        <h1 style="font-size:32px;margin-top:4px">${esc(t.name)}</h1>
        <p style="margin-top:8px;max-width:70ch"><b>O que é:</b> ${esc(t.what)}</p>
        <p style="margin-top:6px;max-width:70ch" class="muted"><b>Por que importa:</b> ${esc(t.why)}</p>
        <div style="display:flex;gap:12px;align-items:center;margin-top:12px"><div class="bar" style="flex:1;max-width:320px"><span style="width:${p.p}%;background:${TC[t.g]}"></span></div><span class="pct">${p.d} de ${p.n} etapas</span></div>
      </div>
      <div class="filters" role="group" aria-label="Filtrar por fase">
        <button data-phase="-1" aria-pressed="${selPhase<0}">Todas as fases</button>
        ${phasesIn.map(f=>`<button data-phase="${f}" aria-pressed="${selPhase===f}">${PHASES[f].n} · ${esc(PHASES[f].p)}</button>`).join("")}
      </div>
      <div class="grid">${steps.map(stepCard).join("") || `<p class="muted">Nenhuma etapa desta trilha nesta fase.</p>`}</div>
    </section>
  </div>`;
}

function viewTimeline(){
  const cp = currentPhase();
  return `<section class="grid" style="gap:10px"><h1>Linha do tempo até 2030</h1>
  <p class="lead">Seis fases. Cada fase junta etapas de várias trilhas para você avançar em tudo ao mesmo tempo, sem pular fundamentos. A fase atual está destacada.</p></section>
  <div class="grid sec" style="gap:28px">
  ${PHASES.map((ph,i)=>{
    const st = ALL.filter(s=>s.f===i), d = st.filter(s=>isDone(s.id)).length;
    const groups = TRACKS.map(t=>({t,items:st.filter(s=>s.track===t)})).filter(g=>g.items.length);
    return `<section class="phase ${i===cp?"now":(i<cp?"past":"")}" id="fase-${i}">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><h2>${ph.n} · ${esc(ph.t)}</h2><span class="pill">${esc(ph.p)}</span>${i===cp?'<span class="pill p">Você está aqui</span>':""}<span class="pct muted">${d}/${st.length}</span></div>
      <p class="muted" style="margin-top:6px;max-width:75ch">${esc(ph.g)}</p>
      <div class="pgroup">${groups.map(g=>`<div class="card"><div class="tlabel" style="--tc:${TC[g.t.g]}"><i></i>${esc(g.t.name)}</div>${g.items.map(s=>chk(s.id, esc(s.t), "t-")).join("")}</div>`).join("")}</div>
    </section>`;}).join("")}
  </div>`;
}

function glossList(){
  const q = glossQ.trim().toLowerCase();
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const nq = norm(q);
  let out = "";
  GLOSS.forEach(([cat,items])=>{
    const f = items.filter(([t,d])=>!nq || norm(t).includes(nq) || norm(d).includes(nq));
    if (f.length) out += `<div class="gcat">${esc(cat)}</div>` + f.map(([t,d])=>`<dl class="card" style="margin:0;padding:14px"><dt>${esc(t)}</dt><dd>${esc(d)}</dd></dl>`).join("");
  });
  return out || `<p class="muted">Nenhum termo encontrado. Pergunte ao Claude e anote no Diário de bordo.</p>`;
}
function viewGlossary(){
  return `<section class="grid" style="gap:10px"><h1>Glossário</h1>
  <p class="lead">Os nomes que mais confundem, explicados em uma ou duas frases. Comece por aqui antes de qualquer trilha.</p>
  <label for="gq" class="small muted">Buscar termo</label>
  <input id="gq" class="search" type="search" placeholder="Ex.: API, Git, framework" value="${esc(glossQ)}"></section>
  <div class="gloss" id="glist">${glossList()}</div>`;
}

function viewRoutine(){
  return `<section class="grid" style="gap:10px"><h1>Rotina semanal</h1>
  <p class="lead">Cerca de 8 a 10 horas por semana além da faculdade e do trabalho. Constância vence intensidade. Ajuste ao seu horário real e bloqueie no Google Agenda.</p></section>
  <div class="tablewrap sec"><table>
    <thead><tr><th>Dia</th><th>Inglês</th><th>Bloco técnico</th><th>Projeto e revisão</th></tr></thead>
    <tbody>${ROUTINE.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody>
  </table></div>
  <section class="two sec">
    <div class="card"><h2>Como fazer cada bloco de 1 hora</h2>
      <ol class="rules" style="margin-top:10px">
        <li>5 min: revise no Anki o que viu antes.</li>
        <li>40 min: estude ou pratique, sem celular.</li>
        <li>10 min: explique em voz alta ou por escrito o que aprendeu, sem olhar.</li>
        <li>5 min: marque a etapa aqui e anote uma linha no Diário de bordo.</li>
      </ol></div>
    <div class="card"><h2>Regras da rotina</h2>
      <ul class="rules" style="margin-top:10px">
        <li>Semana de provas da faculdade: só inglês e revisão. A faculdade vem primeiro.</li>
        <li>Perdeu um dia? Não compense dobrando. Só não perca dois seguidos.</li>
        <li>Férias: avance a trilha que mais atrasou ou faça um projeto maior.</li>
        <li>Descanso e sono fazem parte do treino. Cérebro cansado não fixa conteúdo.</li>
      </ul></div>
  </section>`;
}

function viewGoals(){
  const areas = ["Geral",...TRACKS.map(t=>t.name)];
  const goals = state.goals.slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0) || String(a.due||"9999").localeCompare(String(b.due||"9999")));
  return `<section class="grid" style="gap:10px"><h1>Metas e diário de bordo</h1>
  <p class="lead">Metas com prazo transformam o plano em ação. O diário mostra sua evolução e permite ao Claude acompanhar você nas próximas conversas.</p></section>
  <section class="card sec"><h2>Suas metas</h2>
    <form id="gform" class="form" style="margin-top:12px">
      <label class="f" for="g-text">Meta<input id="g-text" required maxlength="200" placeholder="Ex.: Terminar o Mundo 1 de Python"></label>
      <label class="f" for="g-due">Prazo<input id="g-due" type="date"></label>
      <label class="f" for="g-area">Área<select id="g-area">${areas.map(a=>`<option>${esc(a)}</option>`).join("")}</select></label>
      <button class="btn" type="submit">Adicionar meta</button>
    </form>
    <div style="margin-top:12px">${goals.length?goals.map(g=>`<div class="goal"><label class="chk" for="gl-${esc(g.id)}"><input type="checkbox" id="gl-${esc(g.id)}" data-goal="${esc(g.id)}" ${g.done?"checked":""}><span class="${g.done?"done-title":""}"><b>${esc(g.text)}</b><br><span class="small muted">${esc(g.area||"Geral")}${g.due?" · até "+fmtDate(g.due):""}</span></span></label><button class="x" data-delgoal="${esc(g.id)}" aria-label="Remover meta">Remover</button></div>`).join(""):`<p class="muted">Nenhuma meta ainda. Sugestão para começar: “Fazer o teste de inglês EF SET até o fim do mês”.</p>`}</div>
  </section>
  <section class="card sec"><h2>Diário de bordo</h2>
    <form id="lform" style="margin-top:12px;display:grid;gap:10px">
      <label class="f" for="l-text">O que aprendi, o que travou, o que vou fazer
      <textarea id="l-text" maxlength="2000" placeholder="Ex.: Entendi laços for. Travei em listas dentro de listas. Amanhã: 5 exercícios no Beecrowd."></textarea></label>
      <div><button class="btn" type="submit">Salvar entrada</button></div>
    </form>
    <div style="margin-top:12px">${state.log.length?state.log.map(l=>`<div class="logitem"><time>${esc(new Date(l.at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}))}</time><p style="white-space:pre-wrap;margin-top:2px">${esc(l.text)}</p></div>`).join(""):`<p class="muted">Nenhuma entrada ainda.</p>`}</div>
  </section>`;
}

function viewBackup(){
  return `<section class="grid" style="gap:10px"><h1>Backup do progresso</h1>
  <p class="lead">Aberto pelo Claude, o seu progresso fica salvo na sua conta e aparece em qualquer aparelho. Se você publicar este site no GitHub Pages, ele salva no navegador. Use o backup para levar o progresso de um lugar para o outro.</p></section>
  <section class="two sec">
    <div class="card"><h2>Exportar</h2><p class="muted small" style="margin-top:4px">Copie e guarde num arquivo ou no Drive.</p>
      <textarea id="exp" readonly style="margin-top:10px;font-family:var(--mono);font-size:12px">${esc(JSON.stringify(state))}</textarea>
      <button class="btn ghost" data-copy="exp" style="margin-top:8px">Copiar backup</button></div>
    <div class="card"><h2>Importar</h2><p class="muted small" style="margin-top:4px">Cole um backup. Ele substitui o progresso atual.</p>
      <textarea id="imp" style="margin-top:10px;font-family:var(--mono);font-size:12px" placeholder='{"done":{...},"goals":[...],"log":[...]}'></textarea>
      <button class="btn" id="doimp" style="margin-top:8px">Importar backup</button></div>
  </section>
  <section class="card sec"><h2>Recomeçar do zero</h2><p class="muted small" style="margin-top:4px">Apaga etapas, metas e diário. Exporte antes.</p>
    <div id="resetbox" style="margin-top:10px"><button class="btn danger" id="reset1">Apagar todo o progresso</button></div></section>`;
}

const VIEWS = {"inicio":viewHome,"trilhas":viewTracks,"linha-do-tempo":viewTimeline,"glossario":viewGlossary,"rotina":viewRoutine,"metas":viewGoals,"backup":viewBackup};
function curView(){ const h = location.hash.slice(1); return VIEWS[h] ? h : "inicio"; }
function render(){
  const v = curView();
  document.querySelectorAll("#tabs a").forEach(a=>{ if (a.getAttribute("href")==="#"+v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const y = window.scrollY;
  $("#view").innerHTML = VIEWS[v]();
  window.scrollTo(0,y);
}

document.addEventListener("change", e=>{
  const el = e.target;
  if (el.dataset.step){ const id = el.dataset.step; if (el.checked) state.done[id] = Date.now(); else delete state.done[id]; touch(); render(); if (el.checked) toast("Etapa concluída. Continue assim!"); }
  if (el.dataset.goal){ const g = state.goals.find(x=>x.id===el.dataset.goal); if (g){ g.done = el.checked; touch(); render(); } }
});
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-track],[data-phase],[data-goto],[data-copy],[data-delgoal],#doimp,#reset1,#reset2,#reset0");
  if (!b) return;
  if (b.dataset.track){ selTrack = b.dataset.track; selPhase = -1; render(); window.scrollTo(0,0); }
  else if (b.dataset.phase !== undefined){ selPhase = Number(b.dataset.phase); render(); }
  else if (b.dataset.goto){ selTrack = b.dataset.goto; selPhase = -1; window.scrollTo(0,0); if (curView()==="trilhas") render(); }
  else if (b.dataset.copy){ const src = document.getElementById(b.dataset.copy); const txt = src.value ?? src.textContent; try { await navigator.clipboard.writeText(txt); toast("Copiado"); } catch(err){ if (src.select) src.select(); toast("Selecionei o texto: copie com Cmd+C"); } }
  else if (b.dataset.delgoal){ state.goals = state.goals.filter(g=>g.id!==b.dataset.delgoal); touch(); render(); }
  else if (b.id==="doimp"){
    try { const s = JSON.parse($("#imp").value); if (!s || typeof s!=="object" || !s.done) throw 0; state = normalize(s); touch(); render(); toast("Backup importado"); }
    catch(err){ toast("Não reconheci esse backup. Cole o texto completo que você exportou."); }
  }
  else if (b.id==="reset1"){ $("#resetbox").innerHTML = `<p style="margin-bottom:8px"><b>Tem certeza?</b> Isso não pode ser desfeito.</p><button class="btn danger" id="reset2">Sim, apagar tudo</button> <button class="btn ghost" id="reset0">Cancelar</button>`; }
  else if (b.id==="reset0"){ render(); }
  else if (b.id==="reset2"){ state = {done:{},goals:[],log:[],updated:0}; touch(); render(); toast("Progresso apagado"); }
});
document.addEventListener("submit", e=>{
  e.preventDefault();
  if (e.target.id==="gform"){
    const text = $("#g-text").value.trim(); if (!text) return;
    state.goals.push({id:"g"+Date.now().toString(36), text, due:$("#g-due").value||"", area:$("#g-area").value, done:false, at:Date.now()});
    touch(); render(); toast("Meta adicionada");
  }
  if (e.target.id==="lform"){
    const text = $("#l-text").value.trim(); if (!text) return;
    state.log.unshift({at:Date.now(), text}); state.log = state.log.slice(0,300);
    touch(); render(); toast("Entrada salva");
  }
});
document.addEventListener("input", e=>{ if (e.target.id==="gq"){ glossQ = e.target.value; $("#glist").innerHTML = glossList(); } });
window.addEventListener("hashchange", ()=>{ render(); window.scrollTo(0,0); });

render();
connectDb();
</script>
</body>
</html>
