<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto Perfeição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F3EE; --surface:#FFFFFF; --ink:#141B26; --muted:#5A6472; --line:#D9DCD3; --grid:rgba(39,71,199,.06);
  --accent:#2747C7; --accent-soft:#E3E8FB; --mark:#F5D547; --ok:#1F7A4D; --warn:#C2410C;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --shadow:0 1px 0 rgba(20,27,38,.04),0 8px 24px -16px rgba(20,27,38,.25);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1219;--surface:#161B24;--ink:#E9EBF0;--muted:#9AA3B2;--line:#283041;--grid:rgba(138,162,255,.05);--accent:#8AA2FF;--accent-soft:#1D2742;--mark:#E2C23A;--ok:#4CC38A;--warn:#F59E5B;--shadow:0 8px 24px -16px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1219;--surface:#161B24;--ink:#E9EBF0;--muted:#9AA3B2;--line:#283041;--grid:rgba(138,162,255,.05);--accent:#8AA2FF;--accent-soft:#1D2742;--mark:#E2C23A;--ok:#4CC38A;--warn:#F59E5B;--shadow:0 8px 24px -16px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.02em}
.h1s{font-size:clamp(26px,3.4vw,36px)} h2{font-size:22px;font-weight:700} p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 0}
.brand{font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand i{width:14px;height:14px;background:var(--accent);border-radius:4px;box-shadow:4px 4px 0 var(--mark)}
nav.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync.cloud b{background:var(--ok)} .sync.busy b{background:var(--warn)}
@media (max-width:760px){.sync span{display:none}.brand span{display:none}}
main{padding:30px 0 90px}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:14px}
.lead{font-size:19px;max-width:62ch;color:var(--muted)}
.tw{max-width:70ch;margin-top:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pagehead{display:grid;gap:10px}
.sec{margin-top:28px}
.row{display:flex;gap:10px;align-items:center} .row.wrap,.wrap.row{flex-wrap:wrap}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.herotxt,.heroring{position:relative;z-index:1}.herotxt{display:grid;gap:14px}
.heroring{display:grid;justify-items:center;gap:6px}
.herobtns{display:flex;gap:10px;flex-wrap:wrap}
.ring .ringtxt{font-family:var(--display);font-weight:800;font-size:28px;fill:var(--ink)}
@media (max-width:700px){.hero{grid-template-columns:1fr;padding:22px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat .n{font-family:var(--display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .of{font-size:18px;color:var(--muted);font-weight:600}
.stat .l{font-size:14px;color:var(--muted);margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar.thin{height:5px;margin-top:5px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.two-even{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:860px){.two,.two-even{grid-template-columns:1fr}}
.trow{display:grid;grid-template-columns:36px 1fr 52px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);text-decoration:none;color:inherit}
.trow:last-child{border-bottom:0}.trow:hover .tname{color:var(--accent)}
.tnum{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--tc);border-radius:7px;padding:3px 0;text-align:center;width:30px}
.pct{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.tname{font-weight:600;font-size:15px}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.chk.inline{display:inline-flex;align-items:center;gap:6px;margin-right:10px}
.chk input[type=checkbox]{appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:7px;margin:2px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--surface);transition:background .15s}
.chk input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
.chk input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.done-title{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--mark) 70%,transparent) 58%)}
.next{padding:0;margin:0}.next li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line)}.next li:last-child{border-bottom:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;vertical-align:middle}
.pill.g,.pill.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.pill.p,.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pill.l{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 15px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:14px;text-decoration:underline}
.rules{margin:10px 0 0;padding-left:22px}.rules li{margin:6px 0}
.plain{margin:6px 0 0;padding-left:18px}
pre.prompt{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--accent-soft);border-radius:10px;padding:14px;margin:10px 0;line-height:1.5}
.tracks{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
@media (max-width:860px){.tracks{grid-template-columns:1fr}}
.tlist{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:8px}
@media (max-width:860px){.tlist{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px}.tlist button{min-width:220px}}
.tlist button{width:100%;text-align:left;background:transparent;border:0;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:34px 1fr 42px;gap:6px;align-items:center;border-radius:10px}
.tlist button:hover{background:var(--accent-soft)}
.tlist button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.thead{border-top:6px solid var(--tc,var(--accent))}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.step.isdone{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.stephead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.stitle{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.25}
.stepbody{padding-left:34px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.desc{margin-top:8px;max-width:72ch}
.res{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:7px}
.res li{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:baseline;font-size:15px}
.rtype{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.proj{margin-top:12px;font-size:15px;border-left:3px solid var(--mark);padding:6px 12px;background:color-mix(in srgb,var(--mark) 14%,transparent);border-radius:0 8px 8px 0}
.labs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lablink{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;text-decoration:none}
.lablink:hover{filter:brightness(.97)}.lablink.planned{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.dot.sw{background:var(--accent)}.dot.hw{background:var(--warn)}
.evform{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.evform summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent)}
.evform form{display:grid;gap:10px;margin-top:10px}
.evbox{margin-top:12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:color-mix(in srgb,var(--ok) 9%,transparent);border-radius:10px;padding:8px 12px;font-size:15px}
.evbox p{flex:1;min-width:200px}
.metro{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.metro::before{content:"";position:absolute;left:8%;right:8%;top:11px;height:4px;background:var(--line);border-radius:4px}
.stop{display:grid;justify-items:center;text-align:center;gap:2px;text-decoration:none;color:inherit;position:relative;font-size:14px}
.stop .node{width:26px;height:26px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.stop.past .node{background:var(--ok);border-color:var(--ok)}.stop.now .node{background:var(--mark);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
@media (max-width:700px){.metro{grid-template-columns:repeat(3,1fr);row-gap:14px}.metro::before{display:none}}
.phase{border-left:4px solid var(--line);padding:4px 0 4px 22px;margin-left:8px;position:relative;scroll-margin-top:90px}
.phase::before{content:"";position:absolute;left:-12px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:4px solid var(--line)}
.phase.now{border-left-color:var(--accent)}.phase.now::before{border-color:var(--accent);background:var(--mark)}.phase.past::before{background:var(--ok);border-color:var(--ok)}
.pgroup{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.pgroup .card{padding:14px}.pgroup .chk{padding:5px 0;font-size:15px}
.tlabel{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.tlabel i{width:10px;height:10px;border-radius:3px;background:var(--tc)}
.search{width:100%;max-width:520px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px}
.gterm{margin:0;padding:14px}.gloss dt{font-family:var(--display);font-weight:700;font-size:17px}.gloss dd{margin:4px 0 0;color:var(--muted);font-size:15px}
.gcat{grid-column:1/-1;margin-top:12px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
th{font-family:var(--display);background:var(--accent-soft)}
.form{display:grid;gap:10px;grid-template-columns:2fr 1fr 1fr auto;align-items:end;margin:12px 0}
@media (max-width:760px){.form{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600}
label.f.inline{display:inline-flex;align-items:center;gap:8px}
label.f input:not([type=range]):not([type=checkbox]):not([type=radio]),label.f select,textarea,.ctrls input:not([type=range]),.sqlb select,.sqlb input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
input[type=range]{accent-color:var(--accent);width:100%;min-width:120px}
textarea{width:100%;min-height:110px;resize:vertical;margin:8px 0}
.goal{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.logitem{padding:10px 0;border-bottom:1px solid var(--line)}.logitem time{font-family:var(--mono);font-size:12px;color:var(--muted)}.logitem p{white-space:pre-wrap;margin-top:2px}
.warnbox{border-color:var(--warn)}.warntext{color:var(--warn)}.oktext{color:var(--ok)}
.evlist{list-style:none;padding:0;margin:0;display:grid;gap:10px}.evlist li{border-bottom:1px solid var(--line);padding-bottom:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.labcard{display:grid;gap:6px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.labcard:hover{transform:translateY(-2px);border-color:var(--accent)}.labcard b{font-family:var(--display);font-size:18px}
.labtag{justify-self:start;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.labtag.hw{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:10px}
.labhead{display:grid;gap:10px;margin-bottom:18px}
.learn{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:4px 0 0;list-style:none}
.learn li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;max-width:420px}
.labnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.lote{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:2px;align-content:start}
.labstage{display:grid;gap:12px}
.linked .chk{padding:6px 0}
.ctrls{gap:8px;align-items:center}
.k{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 4px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.readout>div{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:grid}
.readout b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.note{background:color-mix(in srgb,var(--mark) 18%,transparent);border-left:3px solid var(--mark);padding:10px 14px;border-radius:0 10px 10px 0}
.infobox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.console{background:#0f1520;color:#d8e1f0;font-family:var(--mono);font-size:13px;border-radius:10px;padding:12px;margin:0;white-space:pre-wrap;min-height:44px;max-height:320px;overflow:auto}
.log{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;max-height:220px;overflow:auto;display:grid;gap:4px;align-content:start}
.log .ok{color:var(--ok);font-weight:700}.log .warn{color:var(--warn);font-weight:700}
.pcwrap{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:center}
@media (max-width:760px){.pcwrap{grid-template-columns:1fr}}
.board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;border-radius:16px;background:#0f5132;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 22px)}
.part{position:relative;border:2px solid rgba(255,255,255,.35);background:#173a2a;color:#e8f5ee;border-radius:10px;padding:10px;display:grid;gap:2px;text-align:left;cursor:pointer;min-height:76px;transition:box-shadow .2s,background .2s}
.part b{font-family:var(--display);font-size:16px}.part span{font-size:12px;opacity:.8}
.part.active{box-shadow:0 0 0 3px var(--mark),0 0 18px var(--mark);background:#245a41}.part.alert{box-shadow:0 0 0 3px var(--warn),0 0 18px var(--warn)}
.p-cpu{background:#2a2f3a}
.fan{position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:50%;border:3px dotted #9cf}
.p-cpu.spin .fan{animation:spin .4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ramcells{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:4px}.ramcells i{height:9px;border:1px solid rgba(255,255,255,.4);border-radius:2px}
.packet{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--mark);opacity:0;box-shadow:0 0 12px var(--mark);pointer-events:none;z-index:3}
.monitor{display:grid;justify-items:center}.screen{width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,#1f3b8f,#2747C7);border:10px solid #222;border-radius:10px;padding:8px;display:grid;align-content:start;gap:6px;color:#fff}
.screen.off{background:#05070a}.stand{width:30%;height:16px;background:#333;border-radius:0 0 8px 8px}
.dock{display:flex;flex-wrap:wrap;gap:6px}.win{background:rgba(255,255,255,.95);color:#111;border-top:6px solid var(--c);border-radius:6px;padding:4px 8px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.win button{border:0;background:#eee;border-radius:4px;cursor:pointer;line-height:1}.swapnote{font-size:12px;background:rgba(0,0,0,.35);padding:4px 6px;border-radius:6px}
.bitsrow{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}

.lamp{width:22px;height:22px;border-radius:50%;background:var(--line)}.bit.on .lamp{background:var(--mark);box-shadow:0 0 14px var(--mark)}.bit.on{border-color:var(--accent)}
.challenges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trace{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}@media (max-width:760px){.trace{grid-template-columns:1fr}}

.codebox .ln.cur{background:rgba(245,213,71,.22);box-shadow:inset 3px 0 0 #F5D547}

.netline{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:40px;padding:14px 0}

.gitcols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media (max-width:760px){.gitcols{grid-template-columns:1fr 1fr}}

.gchip.w{border-color:var(--warn);color:var(--warn)}.gchip.s{border-color:var(--accent);color:var(--accent)}.gchip.new{border-style:dashed}.gchip.theirs{background:color-mix(in srgb,var(--mark) 25%,transparent)}
.term{min-height:120px}

.nn canvas{background:var(--paper);border:1px solid var(--line);border-radius:10px;cursor:crosshair}.nn label.f{margin-bottom:8px}
.llmtxt{font-family:var(--display);font-size:clamp(20px,3vw,28px);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.llmtxt mark{background:var(--mark);color:#111;border-radius:6px;padding:0 6px}.caret{animation:blink 1s steps(1) infinite;color:var(--accent)}@keyframes blink{50%{opacity:0}}
.probs{display:grid;gap:6px}.prob{display:grid;grid-template-columns:120px 1fr 64px 40px;gap:10px;align-items:center}
.prob .bar{height:14px}
.ohm{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start}@media (max-width:760px){.ohm{grid-template-columns:1fr}}
.ohm svg{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px}.ohm label.f{margin-bottom:10px}
.mbwrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}@media (max-width:760px){.mbwrap{grid-template-columns:1fr;justify-items:center}}
.mb{position:relative;width:270px;height:220px;background:linear-gradient(160deg,#2b2f36,#16191e);border-radius:22px 22px 10px 10px;display:grid;place-items:center}
.mb.shake{animation:shake .45s}@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(8px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.mbleds{display:grid;grid-template-columns:repeat(5,22px);gap:10px}
.led{width:22px;height:22px;border-radius:4px;border:0;background:#3a1010;cursor:pointer;padding:0}.led.on{background:#ff3b30;box-shadow:0 0 12px #ff3b30}
.mbbtn{position:absolute;top:86px;width:36px;height:36px;border-radius:50%;border:4px solid #555;background:#111;color:#fff;font-weight:800;cursor:pointer}
.mbbtn.a{left:14px}.mbbtn.b{right:14px}.mbbtn:active{transform:scale(.92)}
.mbpins{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#c9a227;color:#3b2f00;font:700 11px var(--mono);padding:6px 0;border-radius:0 0 10px 10px}
.ard{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}@media (max-width:760px){.ard{grid-template-columns:1fr}}
.ard svg{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:12px}.serial{max-height:160px}
